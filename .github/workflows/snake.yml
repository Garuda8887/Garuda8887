name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Garuda8887
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push to output branch
        run: |
          mkdir -p /tmp/snake-output
          cp dist/snake.svg /tmp/snake-output/snake.svg
          cp dist/snake-dark.svg /tmp/snake-output/snake-dark.svg
          cd /tmp/snake-output
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update snake"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Garuda8887/Garuda8887.git" HEAD:output
